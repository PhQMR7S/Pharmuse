name: Pharmuse quality checks
on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Behavior and access tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile browser acceptance
        run: npm run test:e2e
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pharmuse-v11-browser-evidence
          path: qa-results/
          retention-days: 7
