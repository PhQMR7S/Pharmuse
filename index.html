<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c3aed"><title>Pharmuse · Learn Pharmacology</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#25154c;background:#f7f2ff}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #f59e0b;outline-offset:3px}.app{max-width:1100px;margin:auto;padding:22px}.bar,.panel,.tile{background:white;border:1px solid #e8dcff;border-radius:24px;box-shadow:0 8px 25px #512c8710}.bar{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;gap:12px;flex-wrap:wrap}.brand{font-size:1.5rem;font-weight:900;color:#6d28d9}.brand span{background:#7c3aed;color:white;padding:9px;border-radius:13px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button,.small{border:0;border-radius:14px;padding:11px 15px;background:#f1e8ff;color:#5b21b6;font-weight:750}.nav button.active,.primary{background:#7c3aed;color:white}.primary{border:0;border-radius:16px;padding:14px 20px;font-weight:800;box-shadow:0 5px 0 #5b21b6}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #5b21b6}.hero{margin:22px 0;background:linear-gradient(125deg,#6d28d9,#a855f7 70%,#ec4899);border-radius:28px;padding:35px;color:white;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px}.hero h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 10px}.hero p{max-width:550px;line-height:1.7}.mascot{font-size:clamp(5rem,15vw,10rem);filter:drop-shadow(0 12px 10px #39127155)}.layout{display:grid;grid-template-columns:2fr 1fr;gap:20px}.panel{padding:24px;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{padding:20px;text-align:center}.tile strong{font-size:1.8rem;display:block;color:#7c3aed}.path{display:flex;flex-direction:column;align-items:center;gap:8px;margin:20px}.node{border:0;border-radius:50%;width:74px;height:74px;background:#7c3aed;color:white;font-size:2rem;box-shadow:0 6px 0 #5b21b6}.node.done{background:#16a34a;box-shadow:0 6px 0 #15803d}.node.locked{background:#d8d0e7;box-shadow:none}.connector{height:24px;width:5px;background:#d8c8f6;border-radius:5px}.choices{display:grid;gap:12px;margin:20px 0}.choice{padding:17px;text-align:start;border:2px solid #e4d8f7;border-radius:15px;background:white;color:inherit}.choice:hover{border-color:#8b5cf6}.choice.correct{border-color:#16a34a;background:#dcfce7}.choice.wrong{border-color:#dc2626;background:#fee2e2}.muted{color:#76688f}.pill{display:inline-block;background:#ede9fe;color:#5b21b6;border-radius:100px;padding:7px 13px;font-weight:750}.progress{height:12px;background:#e9ddfc;border-radius:12px;overflow:hidden}.progress>div{height:100%;background:#22c55e;transition:width .3s}.auth{max-width:460px;margin:35px auto}.auth input{display:block;width:100%;padding:14px;border:1px solid #d7c5f0;border-radius:13px;margin:12px 0}.notice{padding:15px;border-radius:15px;background:#f1e8ff;line-height:1.6}.hidden{display:none}footer{text-align:center;padding:25px;color:#75648f}body.dark{background:#171122;color:#f5efff}body.dark .bar,body.dark .panel,body.dark .tile,body.dark .choice{background:#281e39;color:#f5efff;border-color:#4e3a68}body.dark .muted{color:#c5b6d8}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.mascot{display:none}.cards{grid-template-columns:repeat(3,1fr)}.tile{padding:10px}.app{padding:10px}.bar{padding:12px}.nav button{padding:9px}}
</style></head><body><div class="app"><header class="bar"><div class="brand"><span>💊</span> Pharmuse</div><nav class="nav" id="nav"></nav><div><button class="small" id="language">العربية</button> <button class="small" id="theme">☾</button></div></header><main id="view"></main><footer>Pharmuse V1 · Educational prototype · Not medical advice</footer></div><script>
const lessons=[{title:"Receptors & Agonists",ar:"المستقبلات والناهضات",intro:"An agonist binds to a receptor and activates it to produce a response.",introAr:"الناهض يرتبط بالمستقبل ويفعّله لإحداث استجابة.",q:"What does an agonist do?",qa:"ما وظيفة الناهض الدوائي؟",options:["Blocks receptor activation","Binds and activates a receptor","Destroys the receptor"],optionsAr:["يمنع تنشيط المستقبل","يرتبط بالمستقبل وينشّطه","يدمّر المستقبل"],correct:1,why:"Agonists have affinity and efficacy. Antagonists bind without activating.",whyAr:"الناهض يمتلك ألفة وفعالية، أما المضاد فيرتبط دون تنشيط."},{title:"Pharmacokinetics",ar:"الحركية الدوائية",intro:"Pharmacokinetics describes what the body does to a drug: absorption, distribution, metabolism and excretion.",introAr:"الحركية الدوائية تصف ما يفعله الجسم بالدواء: الامتصاص والتوزيع والاستقلاب والإطراح.",q:"Which process belongs to pharmacokinetics?",qa:"أي عملية تنتمي للحركية الدوائية؟",options:["Receptor activation","Drug metabolism","Intrinsic efficacy"],optionsAr:["تنشيط المستقبل","استقلاب الدواء","الفعالية الذاتية"],correct:1,why:"Metabolism is one of the ADME processes.",whyAr:"الاستقلاب أحد عناصر ADME."},{title:"Beta Blockers",ar:"حاصرات بيتا",intro:"Beta blockers antagonize beta-adrenergic receptors; their effects depend on receptor selectivity and clinical context.",introAr:"حاصرات بيتا تثبط مستقبلات بيتا الأدرينرجية، وتعتمد تأثيراتها على انتقائيتها والسياق السريري.",q:"Beta blockers are primarily:",qa:"حاصرات بيتا هي أساساً:",options:["Beta receptor antagonists","Beta receptor agonists","Antibiotics"],optionsAr:["مضادات مستقبلات بيتا","ناهضات مستقبلات بيتا","مضادات حيوية"],correct:0,why:"They block beta-adrenergic receptor signaling.",whyAr:"تمنع الإشارات عبر مستقبلات بيتا الأدرينرجية."}];
const key="pharmuse-v1-demo";let state;try{state=JSON.parse(localStorage.getItem(key))||{lang:"en",dark:false,done:[],xp:0,streak:0}}catch{state={lang:"en",dark:false,done:[],xp:0,streak:0}}let page="home",selected=null,current=0;const ar=()=>state.lang==="ar",t=(en,arabic)=>ar()?arabic:en,save=()=>localStorage.setItem(key,JSON.stringify(state)),el=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));function go(p){page=p;selected=null;render()}function nav(){const items=[["home","🏠",t("Home","الرئيسية")],["learn","🗺️",t("Learn","تعلم")],["review","🧠",t("Review","مراجعة")],["progress","🏆",t("Progress","التقدم")],["profile","👤",t("Profile","حسابي")]];el("nav").innerHTML=items.map(([p,i,n])=>'<button class="'+(page===p?"active":"")+'" data-go="'+p+'">'+i+" "+n+"</button>").join("")}function render(){document.documentElement.lang=state.lang;document.documentElement.dir=ar()?"rtl":"ltr";document.body.classList.toggle("dark",state.dark);el("language").textContent=ar()?"English":"العربية";nav();let out="";if(page==="home"){out='<section class="hero"><div><span class="pill">'+t("Your learning adventure","مغامرتك التعليمية")+'</span><h1>'+t("Learn pharmacology through play!","تعلّم الفارما باللعب!")+'</h1><p>'+t("Tiny lessons, clever challenges, and rewards. Master one mechanism at a time.","دروس قصيرة وتحديات ذكية ومكافآت. أتقن كل آلية خطوة بخطوة.")+'</p><button class="primary" data-go="learn">'+t("Start learning →","ابدأ التعلم ←")+'</button></div><div class="mascot">👩🏻‍🔬💊</div></section><div class="cards"><div class="tile">🔥<strong>'+state.streak+'</strong>'+t("Streak","سلسلة")+'</div><div class="tile">💎<strong>'+state.xp+'</strong>XP</div><div class="tile">⭐<strong>'+state.done.length+'/'+lessons.length+'</strong>'+t("Lessons","دروس")+'</div></div><section class="panel"><h2>'+t("Continue your journey","تابع رحلتك")+'</h2><p>'+t("Complete lessons to unlock the next challenge.","أكمل الدروس لفتح التحدي التالي.")+'</p><div class="progress"><div style="width:'+(state.done.length/lessons.length*100)+'%"></div></div><p><button class="primary" data-go="learn">'+t("Learning path","خريطة التعلم")+'</button></p></section>'}else if(page==="learn"){out='<section class="panel"><h1>🗺️ '+t("Your learning path","خريطة التعلم")+'</h1><p class="muted">'+t("World 1 · General Pharmacology","العالم الأول · الفارما العامة")+'</p><div class="path">'+lessons.map((l,i)=>'<button class="node '+(state.done.includes(i)?"done":i>0&&!state.done.includes(i-1)?"locked":"")+'" data-lesson="'+i+'" '+(i>0&&!state.done.includes(i-1)?"disabled":"")+'>'+(state.done.includes(i)?"✓":i>0&&!state.done.includes(i-1)?"🔒":"💊")+'</button><strong>'+esc(ar()?l.ar:l.title)+'</strong>'+(i<lessons.length-1?'<div class="connector"></div>':"")).join("")+'</div></section>'}else if(page==="lesson"){const l=lessons[current];out='<section class="panel"><span class="pill">'+t("Lesson","درس")+' '+(current+1)+' / '+lessons.length+'</span><h1>'+esc(ar()?l.ar:l.title)+'</h1><div class="notice">💡 '+esc(ar()?l.introAr:l.intro)+'</div><h2>'+esc(ar()?l.qa:l.q)+'</h2><div class="choices">'+l.options.map((o,i)=>'<button class="choice '+(selected===null?"":i===l.correct?"correct":selected===i?"wrong":"")+'" data-answer="'+i+'" '+(selected!==null?"disabled":"")+'>'+esc(ar()?l.optionsAr[i]:o)+'</button>').join("")+'</div>'+(selected===null?"":'<div class="notice"><strong>'+(selected===l.correct?t("Correct! 🎉","صحيح! 🎉"):t("Not quite — keep learning 💜","مو تمام — واصل التعلم 💜"))+'</strong><p>'+esc(ar()?l.whyAr:l.why)+'</p><button class="primary" data-next="1">'+t("Continue","متابعة")+'</button></div>')+'</section>'}else if(page==="review"){out='<section class="panel"><h1>🧠 '+t("Review hub","مركز المراجعة")+'</h1><p>'+t("Repeat completed lessons to strengthen recall.","أعد الدروس المكتملة لتعزيز التذكر.")+'</p>'+state.done.map(i=>'<p><button class="small" data-lesson="'+i+'">'+esc(ar()?lessons[i].ar:lessons[i].title)+'</button></p>').join("")+(!state.done.length?'<p class="muted">'+t("Finish your first lesson to unlock review.","أكمل أول درس لفتح المراجعة.")+'</p>':"")+'</section>'}else if(page==="progress"){out='<section class="panel"><h1>🏆 '+t("Your progress","تقدمك")+'</h1><div class="cards"><div class="tile">💎<strong>'+state.xp+'</strong>XP</div><div class="tile">📚<strong>'+state.done.length+'</strong>'+t("Completed","مكتمل")+'</div><div class="tile">🎯<strong>'+Math.round(state.done.length/lessons.length*100)+'%</strong>'+t("Path","المسار")+'</div></div><h2>'+t("World mastery","إتقان العالم")+'</h2><div class="progress"><div style="width:'+(state.done.length/lessons.length*100)+'%"></div></div></section>'}else if(page==="profile"){out='<section class="panel"><h1>👤 '+t("Your profile","ملفك الشخصي")+'</h1><p>'+t("Guest demo · Progress is stored only in this browser.","تجربة ضيف · التقدم محفوظ في هذا المتصفح فقط.")+'</p><p><button class="small" data-go="auth">'+t("Account preview","معاينة الحساب")+'</button></p><button class="small" data-reset="1">'+t("Reset demo progress","إعادة ضبط التقدم التجريبي")+'</button></section>'}else if(page==="auth"){out='<section class="panel auth"><h1>💜 '+t("Welcome to Pharmuse","أهلاً بك في Pharmuse")+'</h1><p>'+t("Account creation is not connected yet. Try the guest learning experience.","إنشاء الحساب غير مربوط بعد. يمكنك تجربة التعلم كضيف.")+'</p><label>'+t("Email","البريد الإلكتروني")+'<input type="email" autocomplete="email" placeholder="student@example.com" disabled></label><label>'+t("Password","كلمة المرور")+'<input type="password" disabled></label><div class="notice">'+t("Demo only — no credentials are collected.","معاينة فقط — لا تُجمع أي بيانات دخول.")+'</div><p><button class="primary" data-go="home">'+t("Continue as guest","المتابعة كضيف")+'</button></p></section>'}el("view").innerHTML=out}document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.lesson!==undefined){current=Number(b.dataset.lesson);selected=null;go("lesson")}if(b.dataset.answer!==undefined&&selected===null){selected=Number(b.dataset.answer);render()}if(b.dataset.next){if(selected===lessons[current].correct&&!state.done.includes(current)){state.done.push(current);state.xp+=20;state.streak=1;save()}go("learn")}if(b.dataset.reset){if(confirm(t("Reset local demo progress?","هل تريد تصفير التقدم التجريبي؟"))){state.done=[];state.xp=0;state.streak=0;save();render()}}});el("language").onclick=()=>{state.lang=ar()?"en":"ar";save();render()};el("theme").onclick=()=>{state.dark=!state.dark;save();render()};render();
</script></body></html>
